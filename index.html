<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>課程獎狀產生器</title>
<style>
  :root{
    --bg:#f4f1ec; --panel:#fff; --line:#e2ddd4; --ink:#3a352f; --muted:#8b8378;
    --gold:#b8974f; --gold-dark:#96772f;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:"Noto Sans TC","PingFang TC","Heiti TC","Microsoft JhengHei",system-ui,sans-serif;
  }
  header{
    padding:18px 24px; background:linear-gradient(100deg,#6d6459,#a1927c 55%,#d9c79a);
    color:#fff; display:flex; align-items:baseline; gap:14px; flex-wrap:wrap;
  }
  header h1{font-size:20px; margin:0; letter-spacing:1px}
  header span{font-size:13px; opacity:.85}
  .wrap{display:flex; gap:20px; padding:20px; align-items:flex-start; flex-wrap:wrap}
  .panel{
    background:var(--panel); border:1px solid var(--line); border-radius:12px;
    box-shadow:0 2px 10px rgba(0,0,0,.05);
  }
  #form{width:340px; flex:0 0 340px; padding:16px}
  #stage{flex:1 1 520px; min-width:360px; padding:16px}
  fieldset{border:none; margin:0 0 4px; padding:0}
  label{display:block; font-size:13px; color:var(--muted); margin:12px 0 5px}
  label:first-child{margin-top:0}
  input[type=text], input[type=url], select{
    width:100%; padding:8px 10px; font-size:14px; font-family:inherit;
    border:1px solid var(--line); border-radius:7px; background:#fcfbf9; color:var(--ink);
  }
  input:focus,select:focus{outline:none; border-color:var(--gold); box-shadow:0 0 0 3px rgba(184,151,79,.15)}
  .row{display:flex; gap:10px}
  .row>div{flex:1}
  .drop{
    margin-top:6px; border:2px dashed var(--line); border-radius:10px; padding:14px;
    text-align:center; font-size:13px; color:var(--muted); cursor:pointer; background:#fcfbf9;
    transition:.15s;
  }
  .drop.over,.drop:hover{border-color:var(--gold); background:#fdf9f0; color:var(--gold-dark)}
  .drop b{display:block; color:var(--ink); font-size:13px; margin-bottom:3px}
  input[type=range]{width:100%; accent-color:var(--gold)}
  .hint{font-size:12px; color:var(--muted); line-height:1.6; margin:8px 0 0}
  details{margin-top:14px; border-top:1px solid var(--line); padding-top:10px}
  summary{font-size:13px; color:var(--muted); cursor:pointer; user-select:none}
  .btns{display:flex; gap:10px; margin-top:18px}
  button{
    font-family:inherit; font-size:14px; padding:10px 14px; border-radius:8px; cursor:pointer;
    border:1px solid var(--line); background:#fff; color:var(--ink); transition:.15s;
  }
  button:hover{border-color:var(--gold); color:var(--gold-dark)}
  button.primary{
    flex:1; border:none; color:#fff; font-weight:700; letter-spacing:1px;
    background:linear-gradient(100deg,var(--gold-dark),var(--gold));
  }
  button.primary:hover{filter:brightness(1.08); color:#fff}
  #canvasBox{position:relative; border-radius:8px; overflow:hidden; background:#eee}
  canvas{display:block; width:100%; height:auto; cursor:grab}
  canvas.dragging{cursor:grabbing}
  .stagehint{font-size:12px; color:var(--muted); margin:10px 2px 0; line-height:1.7}
  .badge{display:inline-block; background:#f0ece3; border-radius:5px; padding:1px 6px; margin-right:4px}
  @media (max-width:820px){ #form{width:100%; flex:1 1 100%} }
</style>
</head>
<body>

<header>
  <h1>課程獎狀產生器</h1>
  <span>填寫資料 → 上傳照片 → 下載 PNG（全離線運作，資料不會上傳）</span>
</header>

<div class="wrap">

  <div class="panel" id="form">
    <fieldset>
      <label for="fTitlePreset">課程名稱</label>
      <select id="fTitlePreset">
        <option value="">— 從清單選擇，或直接在下方輸入 —</option>
        <option>彼得潘的 iOS SwiftUI App 程式設計入門</option>
        <option>文組生的 iOS SwiftUI App 程式設計入門</option>
        <option>彼得潘的 Flutter 跨平台 App 程式設計入門</option>
      </select>
      <input type="text" id="fTitle" placeholder="彼得潘的 iOS SwiftUI App 程式設計入門" style="margin-top:7px">

      <label for="fName">學員姓名</label>
      <input type="text" id="fName" placeholder="許文寧 Becky">

      <div class="row">
        <div>
          <label for="fSession">屆數 (SESSION)</label>
          <input type="text" id="fSession" placeholder="第一屆">
        </div>
        <div>
          <label for="fHours">時數 (LEARNING HOURS)</label>
          <input type="text" id="fHours" placeholder="30">
        </div>
      </div>

      <label for="fDate">日期 (DATE)</label>
      <input type="text" id="fDate" placeholder="2016/7/6 ~ 9/7">

      <label for="fUrl">QR Code 網址</label>
      <input type="url" id="fUrl" placeholder="https://example.com/course">

      <label>學員照片</label>
      <div class="drop" id="drop">
        <b>點此選擇照片，或直接拖曳進來</b>
        JPG / PNG，會自動裁成圓形
      </div>
      <input type="file" id="fPhoto" accept="image/*" hidden>

      <label for="fZoom">照片縮放 <span id="zoomVal" style="float:right"></span></label>
      <input type="range" id="fZoom" min="0.5" max="3" step="0.01" value="1">
    </fieldset>

    <details>
      <summary>進階微調</summary>
      <label for="fCircle">照片圓框大小 <span id="circleVal" style="float:right"></span></label>
      <input type="range" id="fCircle" min="121" max="170" step="1" value="121">

      <label for="fQrSize">QR Code 大小 <span id="qrVal" style="float:right"></span></label>
      <input type="range" id="fQrSize" min="60" max="140" step="1" value="92">

      <label for="fScale">輸出解析度</label>
      <select id="fScale">
        <option value="1">1x（934 × 662）</option>
        <option value="2" selected>2x（1868 × 1324）</option>
        <option value="3">3x（2802 × 1986）</option>
        <option value="4">4x（3736 × 2648）</option>
      </select>
      <p class="hint">照片可直接在右邊預覽圖上拖曳調整位置。</p>
    </details>

    <div class="btns">
      <button class="primary" id="btnDownload">下載獎狀 PNG</button>
      <button id="btnSample" title="填入範例資料">範例</button>
      <button id="btnReset" title="清空所有欄位">清空</button>
    </div>
  </div>

  <div class="panel" id="stage">
    <div id="canvasBox"><canvas id="cv" width="934" height="662"></canvas></div>
    <p class="stagehint">
      <span class="badge">提示</span>在照片上按住滑鼠拖曳可移動位置，滾輪可縮放。
      <br><span class="badge">提示</span>文字太長會自動縮小以符合版面。
    </p>
  </div>

</div>

<script>
/* 內建 QR Code 產生器（byte mode, UTF-8, 版本 1~40, 自動選版）
   演算法依 ISO/IEC 18004 實作，不依賴任何外部函式庫。 */
const QRCodeGen = (function () {
  const ECL = { L: 0, M: 1, Q: 2, H: 3 };
  const ECL_FORMAT_BITS = [1, 0, 3, 2]; // L, M, Q, H

  const ECC_CODEWORDS_PER_BLOCK = [
    [-1,7,10,15,20,26,18,20,24,30,18,20,24,26,30,22,24,28,30,28,28,28,28,30,30,26,28,30,30,30,30,30,30,30,30,30,30,30,30,30,30],
    [-1,10,16,26,18,24,16,18,22,22,26,30,22,22,24,24,28,28,26,26,26,26,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28],
    [-1,13,22,18,26,18,24,18,22,20,24,28,26,24,20,30,24,28,28,26,30,28,30,30,30,30,28,30,30,30,30,30,30,30,30,30,30,30,30,30,30],
    [-1,17,28,22,16,22,28,26,26,24,28,24,28,22,24,24,30,28,28,26,28,30,24,30,30,30,30,30,30,30,30,30,30,30,30,30,30,30,30,30,30],
  ];
  const NUM_ECC_BLOCKS = [
    [-1,1,1,1,1,1,2,2,2,2,4,4,4,4,4,6,6,6,6,7,8,8,9,9,10,12,12,12,13,14,15,16,17,18,19,19,20,21,22,24,25],
    [-1,1,1,1,2,2,4,4,4,5,5,5,8,9,9,10,10,11,13,14,16,17,17,18,20,21,23,25,26,28,29,31,33,35,37,38,40,43,45,47,49],
    [-1,1,1,2,2,4,4,6,6,8,8,8,10,12,16,12,17,16,18,21,20,23,23,25,27,29,34,34,35,38,40,43,45,48,51,53,56,59,62,65,68],
    [-1,1,1,2,4,4,4,5,6,8,8,11,11,16,16,18,16,19,21,25,25,25,34,30,32,35,37,40,42,45,48,51,57,60,63,66,70,74,77,81,84],
  ];

  function getNumRawDataModules(ver) {
    let result = (16 * ver + 128) * ver + 64;
    if (ver >= 2) {
      const numAlign = Math.floor(ver / 7) + 2;
      result -= (25 * numAlign - 10) * numAlign - 55;
      if (ver >= 7) result -= 36;
    }
    return result;
  }

  function getNumDataCodewords(ver, ecl) {
    return Math.floor(getNumRawDataModules(ver) / 8)
      - ECC_CODEWORDS_PER_BLOCK[ecl][ver] * NUM_ECC_BLOCKS[ecl][ver];
  }

  function getAlignmentPatternPositions(ver) {
    if (ver === 1) return [];
    const numAlign = Math.floor(ver / 7) + 2;
    const step = (ver === 32) ? 26
      : Math.ceil((ver * 4 + 4) / (numAlign * 2 - 2)) * 2;
    const result = [6];
    for (let pos = ver * 4 + 17 - 7; result.length < numAlign; pos -= step) result.splice(1, 0, pos);
    return result;
  }

  // ---- Reed-Solomon over GF(256), primitive polynomial 0x11D ----
  function gfMul(x, y) {
    let z = 0;
    for (let i = 7; i >= 0; i--) {
      z = (z << 1) ^ ((z >>> 7) * 0x11D);
      z ^= ((y >>> i) & 1) * x;
    }
    return z & 0xFF;
  }
  function rsDivisor(degree) {
    const result = new Uint8Array(degree);
    result[degree - 1] = 1;
    let root = 1;
    for (let i = 0; i < degree; i++) {
      for (let j = 0; j < degree; j++) {
        result[j] = gfMul(result[j], root);
        if (j + 1 < degree) result[j] ^= result[j + 1];
      }
      root = gfMul(root, 0x02);
    }
    return result;
  }
  function rsRemainder(data, divisor) {
    const result = new Uint8Array(divisor.length);
    for (const b of data) {
      const factor = b ^ result[0];
      result.copyWithin(0, 1);
      result[result.length - 1] = 0;
      for (let i = 0; i < divisor.length; i++) result[i] ^= gfMul(divisor[i], factor);
    }
    return result;
  }

  function addEccAndInterleave(data, ver, ecl) {
    const numBlocks = NUM_ECC_BLOCKS[ecl][ver];
    const blockEccLen = ECC_CODEWORDS_PER_BLOCK[ecl][ver];
    const rawCodewords = Math.floor(getNumRawDataModules(ver) / 8);
    const numShortBlocks = numBlocks - rawCodewords % numBlocks;
    const shortBlockLen = Math.floor(rawCodewords / numBlocks);
    const shortDataLen = shortBlockLen - blockEccLen;

    const blocks = [];
    const rsDiv = rsDivisor(blockEccLen);
    for (let i = 0, k = 0; i < numBlocks; i++) {
      const len = shortDataLen + (i < numShortBlocks ? 0 : 1);
      const dat = data.slice(k, k + len);
      k += len;
      const ecc = rsRemainder(dat, rsDiv);
      const blk = Array.from(dat);
      if (i < numShortBlocks) blk.push(0); // 佔位，稍後跳過
      blocks.push(blk.concat(Array.from(ecc)));
    }

    const result = [];
    for (let i = 0; i < blocks[0].length; i++) {
      for (let j = 0; j < blocks.length; j++) {
        if (i !== shortDataLen || j >= numShortBlocks) result.push(blocks[j][i]);
      }
    }
    return result;
  }

  function getBit(x, i) { return ((x >>> i) & 1) !== 0; }

  function encode(text, eclName) {
    let ecl = ECL[eclName || 'M'];
    const bytes = new TextEncoder().encode(text);

    // 選版本
    let ver = 1;
    for (; ver <= 40; ver++) {
      const capacityBits = getNumDataCodewords(ver, ecl) * 8;
      const ccBits = ver < 10 ? 8 : 16;
      if (4 + ccBits + bytes.length * 8 <= capacityBits) break;
    }
    if (ver > 40) throw new Error('資料太長，無法產生 QR Code');

    // 若空間充裕，自動提升容錯等級（不改變版本）
    for (const better of [ECL.M, ECL.Q, ECL.H]) {
      if (better > ecl) {
        const ccBits = ver < 10 ? 8 : 16;
        if (4 + ccBits + bytes.length * 8 <= getNumDataCodewords(ver, better) * 8) ecl = better;
      }
    }

    // 位元串
    const bb = [];
    const appendBits = (val, len) => { for (let i = len - 1; i >= 0; i--) bb.push((val >>> i) & 1); };
    appendBits(0b0100, 4);
    appendBits(bytes.length, ver < 10 ? 8 : 16);
    for (const b of bytes) appendBits(b, 8);

    const dataCapacityBits = getNumDataCodewords(ver, ecl) * 8;
    appendBits(0, Math.min(4, dataCapacityBits - bb.length));
    appendBits(0, (8 - bb.length % 8) % 8);
    for (let pad = 0xEC; bb.length < dataCapacityBits; pad ^= 0xEC ^ 0x11) appendBits(pad, 8);

    const dataCodewords = new Uint8Array(bb.length / 8);
    bb.forEach((bit, i) => { dataCodewords[i >>> 3] |= bit << (7 - (i & 7)); });

    const allCodewords = addEccAndInterleave(dataCodewords, ver, ecl);
    return buildMatrix(ver, ecl, allCodewords);
  }

  function buildMatrix(ver, ecl, codewords) {
    const size = ver * 4 + 17;
    const modules = Array.from({ length: size }, () => new Array(size).fill(false));
    const isFunc = Array.from({ length: size }, () => new Array(size).fill(false));

    const setFunc = (x, y, dark) => {
      if (x < 0 || y < 0 || x >= size || y >= size) return;
      modules[y][x] = dark;
      isFunc[y][x] = true;
    };

    // 定位圖形 + 分隔
    const drawFinder = (x, y) => {
      for (let dy = -4; dy <= 4; dy++) for (let dx = -4; dx <= 4; dx++) {
        const dist = Math.max(Math.abs(dx), Math.abs(dy));
        setFunc(x + dx, y + dy, dist !== 2 && dist !== 4);
      }
    };
    // 時序圖形
    for (let i = 0; i < size; i++) { setFunc(6, i, i % 2 === 0); setFunc(i, 6, i % 2 === 0); }
    drawFinder(3, 3); drawFinder(size - 4, 3); drawFinder(3, size - 4);

    // 校正圖形
    const alignPos = getAlignmentPatternPositions(ver);
    for (let i = 0; i < alignPos.length; i++) {
      for (let j = 0; j < alignPos.length; j++) {
        if ((i === 0 && j === 0) || (i === 0 && j === alignPos.length - 1) || (i === alignPos.length - 1 && j === 0)) continue;
        for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) {
          setFunc(alignPos[j] + dx, alignPos[i] + dy, Math.max(Math.abs(dx), Math.abs(dy)) !== 1);
        }
      }
    }

    const drawFormatBits = (mask) => {
      const data = (ECL_FORMAT_BITS[ecl] << 3) | mask;
      let rem = data;
      for (let i = 0; i < 10; i++) rem = (rem << 1) ^ ((rem >>> 9) * 0x537);
      const bits = ((data << 10) | rem) ^ 0x5412;
      for (let i = 0; i <= 5; i++) setFunc(8, i, getBit(bits, i));
      setFunc(8, 7, getBit(bits, 6));
      setFunc(8, 8, getBit(bits, 7));
      setFunc(7, 8, getBit(bits, 8));
      for (let i = 9; i < 15; i++) setFunc(14 - i, 8, getBit(bits, i));
      for (let i = 0; i < 8; i++) setFunc(size - 1 - i, 8, getBit(bits, i));
      for (let i = 8; i < 15; i++) setFunc(8, size - 15 + i, getBit(bits, i));
      setFunc(8, size - 8, true);
    };
    drawFormatBits(0);

    if (ver >= 7) {
      let rem = ver;
      for (let i = 0; i < 12; i++) rem = (rem << 1) ^ ((rem >>> 11) * 0x1F25);
      const bits = (ver << 12) | rem;
      for (let i = 0; i < 18; i++) {
        const bit = getBit(bits, i);
        const a = size - 11 + i % 3, b = Math.floor(i / 3);
        setFunc(a, b, bit); setFunc(b, a, bit);
      }
    }

    // 填入資料位元
    let i = 0;
    for (let right = size - 1; right >= 1; right -= 2) {
      if (right === 6) right = 5;
      for (let vert = 0; vert < size; vert++) {
        for (let j = 0; j < 2; j++) {
          const x = right - j;
          const upward = ((right + 1) & 2) === 0;
          const y = upward ? size - 1 - vert : vert;
          if (!isFunc[y][x] && i < codewords.length * 8) {
            modules[y][x] = getBit(codewords[i >>> 3], 7 - (i & 7));
            i++;
          }
        }
      }
    }

    const maskFn = [
      (x, y) => (x + y) % 2 === 0,
      (x, y) => y % 2 === 0,
      (x, y) => x % 3 === 0,
      (x, y) => (x + y) % 3 === 0,
      (x, y) => (Math.floor(x / 3) + Math.floor(y / 2)) % 2 === 0,
      (x, y) => (x * y) % 2 + (x * y) % 3 === 0,
      (x, y) => ((x * y) % 2 + (x * y) % 3) % 2 === 0,
      (x, y) => ((x + y) % 2 + (x * y) % 3) % 2 === 0,
    ];
    const applyMask = (mask) => {
      for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
        if (!isFunc[y][x] && maskFn[mask](x, y)) modules[y][x] = !modules[y][x];
      }
    };

    // 選最佳遮罩
    let bestMask = 0, minPenalty = Infinity;
    for (let mask = 0; mask < 8; mask++) {
      applyMask(mask); drawFormatBits(mask);
      const p = penalty(modules, size);
      if (p < minPenalty) { minPenalty = p; bestMask = mask; }
      applyMask(mask); // 還原
    }
    applyMask(bestMask);
    drawFormatBits(bestMask);

    return { size, modules };
  }

  function penalty(modules, size) {
    let result = 0;
    const N1 = 3, N2 = 3, N3 = 40, N4 = 10;

    const addHistory = (len, rh) => { if (rh[0] === 0) len += size; rh.pop(); rh.unshift(len); };
    const countPatterns = (rh) => {
      const n = rh[1];
      const core = n > 0 && rh[2] === n && rh[3] === n * 3 && rh[4] === n && rh[5] === n;
      return (core && rh[0] >= n * 4 && rh[6] >= n ? 1 : 0) + (core && rh[6] >= n * 4 && rh[0] >= n ? 1 : 0);
    };
    const terminate = (color, len, rh) => {
      if (color) { addHistory(len, rh); len = 0; }
      len += size;
      addHistory(len, rh);
      return countPatterns(rh);
    };

    for (let y = 0; y < size; y++) {
      let color = false, run = 0; const rh = [0, 0, 0, 0, 0, 0, 0];
      for (let x = 0; x < size; x++) {
        if (modules[y][x] === color) { run++; if (run === 5) result += N1; else if (run > 5) result++; }
        else { addHistory(run, rh); if (!color) result += countPatterns(rh) * N3; color = modules[y][x]; run = 1; }
      }
      result += terminate(color, run, rh) * N3;
    }
    for (let x = 0; x < size; x++) {
      let color = false, run = 0; const rh = [0, 0, 0, 0, 0, 0, 0];
      for (let y = 0; y < size; y++) {
        if (modules[y][x] === color) { run++; if (run === 5) result += N1; else if (run > 5) result++; }
        else { addHistory(run, rh); if (!color) result += countPatterns(rh) * N3; color = modules[y][x]; run = 1; }
      }
      result += terminate(color, run, rh) * N3;
    }
    for (let y = 0; y < size - 1; y++) for (let x = 0; x < size - 1; x++) {
      const c = modules[y][x];
      if (c === modules[y][x + 1] && c === modules[y + 1][x] && c === modules[y + 1][x + 1]) result += N2;
    }
    let dark = 0;
    for (const row of modules) for (const c of row) if (c) dark++;
    const total = size * size;
    const k = Math.ceil(Math.abs(dark * 20 - total * 10) / total) - 1;
    result += k * N4;
    return result;
  }

  return { encode };
})();

</script>

const W = 934, H = 662;

const LAYOUT = {
  title:   { cx: 641, baseline: 204, maxW: 545, size: 34, weight: '700', color: 'rgba(122,114,105,.92)' },
  name:    { cx: 622, baseline: 351, maxW: 515, size: 46, weight: '700', color: '#1e1b18' },
  session: { cx: 789, baseline: 441, maxW: 205, size: 26, weight: '400', color: '#2c2823' },
  hours:   { cx: 789, baseline: 521, maxW: 205, size: 26, weight: '400', color: '#2c2823' },
  date:    { cx: 789, baseline: 601, maxW: 215, size: 26, weight: '400', color: '#2c2823' },
  // 底圖白圓實測：中心 (330, 521)、半徑 120.5，照片至少要蓋滿才不會露白邊
  photo:   { cx: 330, cy: 521, minR: 121 },
  qr:      { cx: 66,  cy: 593 },
};
const FONT = '"Noto Sans TC","PingFang TC","Heiti TC","Microsoft JhengHei",sans-serif';

/* ===== 狀態 ===== */
const state = {
  title: '', name: '', session: '', hours: '', date: '', url: '',
  photo: null, zoom: 1, offX: 0, offY: 0,
  circle: 121, qrSize: 92, scale: 2,
};

const $ = (id) => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');

let template = new Image();
let templateReady = false;
template.onload = () => { templateReady = true; render(); };
template.src = TEMPLATE_SRC;

let qrCache = { text: '', matrix: null };

/* ===== 繪製 ===== */
function fitFont(ctx, text, base, weight, maxW) {
  let size = base;
  ctx.font = `${weight} ${size}px ${FONT}`;
  while (ctx.measureText(text).width > maxW && size > 8) {
    size -= 0.5;
    ctx.font = `${weight} ${size}px ${FONT}`;
  }
  return size;
}

function drawText(ctx, text, cfg) {
  if (!text) return;
  fitFont(ctx, text, cfg.size, cfg.weight, cfg.maxW);
  ctx.fillStyle = cfg.color;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'alphabetic';
  ctx.fillText(text, cfg.cx, cfg.baseline);
}

function drawPhoto(ctx) {
  const { cx, cy } = LAYOUT.photo;
  const r = state.circle;
  if (!state.photo) return;
  ctx.save();
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.closePath();
  ctx.clip();
  const img = state.photo;
  const base = (r * 2) / Math.min(img.width, img.height);
  const s = base * state.zoom;
  const w = img.width * s, h = img.height * s;
  ctx.drawImage(img, cx - w / 2 + state.offX, cy - h / 2 + state.offY, w, h);
  ctx.restore();
}

function drawQR(ctx) {
  const url = state.url.trim();
  if (!url) return;
  if (qrCache.text !== url) {
    try { qrCache = { text: url, matrix: QRCodeGen.encode(url, 'M') }; }
    catch (e) { qrCache = { text: url, matrix: null }; }
  }
  const qr = qrCache.matrix;
  if (!qr) return;

  const box = state.qrSize;
  const x0 = LAYOUT.qr.cx - box / 2, y0 = LAYOUT.qr.cy - box / 2;
  ctx.fillStyle = '#fff';
  ctx.fillRect(x0, y0, box, box);

  // 對齊輸出裝置的實體像素，避免模組邊緣糊掉或互相重疊
  const s = (ctx.getTransform ? ctx.getTransform().a : 1) || 1;
  const snap = (v) => Math.round(v * s) / s;

  const quiet = 2; // 靜區（模組數）
  const n = qr.size + quiet * 2;
  const m = box / n;
  ctx.fillStyle = '#000';
  for (let y = 0; y < qr.size; y++) {
    const y1 = snap(y0 + (y + quiet) * m), y2 = snap(y0 + (y + quiet + 1) * m);
    for (let x = 0; x < qr.size; x++) {
      if (!qr.modules[y][x]) continue;
      const x1 = snap(x0 + (x + quiet) * m), x2 = snap(x0 + (x + quiet + 1) * m);
      ctx.fillRect(x1, y1, x2 - x1, y2 - y1);
    }
  }
}

function paint(ctx) {
  ctx.clearRect(0, 0, W, H);
  if (templateReady) ctx.drawImage(template, 0, 0, W, H);
  drawPhoto(ctx);
  drawQR(ctx);
  drawText(ctx, state.title, LAYOUT.title);
  drawText(ctx, state.name, LAYOUT.name);
  drawText(ctx, state.session, LAYOUT.session);
  drawText(ctx, state.hours, LAYOUT.hours);
  drawText(ctx, state.date, LAYOUT.date);
}

const PREVIEW_SCALE = 2;
cv.width = W * PREVIEW_SCALE;
cv.height = H * PREVIEW_SCALE;

function render() {
  ctx.setTransform(PREVIEW_SCALE, 0, 0, PREVIEW_SCALE, 0, 0);
  paint(ctx);
  save();
}

/* ===== 表單綁定 ===== */
const bindings = [
  ['fTitle', 'title'], ['fName', 'name'], ['fSession', 'session'],
  ['fHours', 'hours'], ['fDate', 'date'], ['fUrl', 'url'],
];
bindings.forEach(([id, key]) => {
  $(id).addEventListener('input', (e) => { state[key] = e.target.value; render(); });
});

// 課程名稱：下拉選單與文字框雙向同步
function syncTitlePreset() {
  const sel = $('fTitlePreset');
  const hit = [...sel.options].some(o => o.value && o.value === state.title);
  sel.value = hit ? state.title : '';
}
$('fTitlePreset').addEventListener('change', (e) => {
  if (!e.target.value) return;
  state.title = e.target.value;
  $('fTitle').value = state.title;
  render();
});
$('fTitle').addEventListener('input', syncTitlePreset);

$('fZoom').addEventListener('input', (e) => {
  state.zoom = parseFloat(e.target.value);
  $('zoomVal').textContent = state.zoom.toFixed(2) + '×';
  render();
});
$('fCircle').addEventListener('input', (e) => {
  state.circle = parseInt(e.target.value, 10);
  $('circleVal').textContent = state.circle * 2 + 'px';
  render();
});
$('fQrSize').addEventListener('input', (e) => {
  state.qrSize = parseInt(e.target.value, 10);
  $('qrVal').textContent = state.qrSize + 'px';
  render();
});
$('fScale').addEventListener('change', (e) => { state.scale = parseInt(e.target.value, 10); save(); });

/* ===== 照片上傳 ===== */
function loadPhotoFile(file) {
  if (!file || !file.type.startsWith('image/')) return;
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      state.photo = img;
      state.zoom = 1; state.offX = 0; state.offY = 0;
      $('fZoom').value = 1; $('zoomVal').textContent = '1.00×';
      $('drop').innerHTML = '<b>已載入照片 ✓</b>點此可更換';
      render();
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}
$('drop').addEventListener('click', () => $('fPhoto').click());
$('fPhoto').addEventListener('change', (e) => loadPhotoFile(e.target.files[0]));
['dragenter', 'dragover'].forEach(t => $('drop').addEventListener(t, e => {
  e.preventDefault(); $('drop').classList.add('over');
}));
['dragleave', 'drop'].forEach(t => $('drop').addEventListener(t, e => {
  e.preventDefault(); $('drop').classList.remove('over');
}));
$('drop').addEventListener('drop', e => loadPhotoFile(e.dataTransfer.files[0]));
document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('drop', e => {
  if (e.target.closest('#drop')) return; // 已由上傳區自行處理
  if (e.dataTransfer.files.length) { e.preventDefault(); loadPhotoFile(e.dataTransfer.files[0]); }
});

/* ===== 在畫布上拖曳 / 滾輪縮放照片 ===== */
let dragging = false, lastX = 0, lastY = 0;
function toTemplateCoords(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) * (W / r.width), y: (e.clientY - r.top) * (H / r.height) };
}
cv.addEventListener('pointerdown', (e) => {
  if (!state.photo) return;
  const p = toTemplateCoords(e);
  if (Math.hypot(p.x - LAYOUT.photo.cx, p.y - LAYOUT.photo.cy) > state.circle) return;
  dragging = true; lastX = p.x; lastY = p.y;
  cv.classList.add('dragging'); cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointermove', (e) => {
  if (!dragging) return;
  const p = toTemplateCoords(e);
  state.offX += p.x - lastX; state.offY += p.y - lastY;
  lastX = p.x; lastY = p.y;
  render();
});
['pointerup', 'pointercancel'].forEach(t => cv.addEventListener(t, () => {
  dragging = false; cv.classList.remove('dragging');
}));
cv.addEventListener('wheel', (e) => {
  if (!state.photo) return;
  const p = toTemplateCoords(e);
  if (Math.hypot(p.x - LAYOUT.photo.cx, p.y - LAYOUT.photo.cy) > state.circle) return;
  e.preventDefault();
  state.zoom = Math.min(3, Math.max(0.5, state.zoom * (e.deltaY < 0 ? 1.06 : 1 / 1.06)));
  $('fZoom').value = state.zoom;
  $('zoomVal').textContent = state.zoom.toFixed(2) + '×';
  render();
}, { passive: false });

/* ===== 下載 ===== */
$('btnDownload').addEventListener('click', () => {
  const s = state.scale;
  const out = document.createElement('canvas');
  out.width = W * s; out.height = H * s;
  const octx = out.getContext('2d');
  octx.imageSmoothingQuality = 'high';
  octx.scale(s, s);
  paint(octx);
  out.toBlob((blob) => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    const who = (state.name || '獎狀').replace(/[\\/:*?"<>|]/g, '_');
    a.download = `獎狀_${who}.png`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  }, 'image/png');
});

/* ===== 範例 / 清空 / 本機記憶 ===== */
const SAMPLE = {
  title: '文組生的 iOS SwiftUI App 程式設計入門',
  name: '許文寧 Becky',
  session: '第一屆',
  hours: '30',
  date: '2016/7/6 ~ 9/7',
  url: 'https://www.apple.com/tw/swift/',
};
function applyValues(v) {
  bindings.forEach(([id, key]) => { state[key] = v[key] || ''; $(id).value = state[key]; });
  syncTitlePreset();
  render();
}
$('btnSample').addEventListener('click', () => applyValues(SAMPLE));
$('btnReset').addEventListener('click', () => {
  applyValues({});
  state.photo = null; state.zoom = 1; state.offX = 0; state.offY = 0;
  $('fZoom').value = 1; $('zoomVal').textContent = '1.00×';
  $('drop').innerHTML = '<b>點此選擇照片，或直接拖曳進來</b>JPG / PNG，會自動裁成圓形';
  render();
});

const KEY = 'certificate-maker-v1';
let saveTimer = 0;
function save() { clearTimeout(saveTimer); saveTimer = setTimeout(saveNow, 250); }
function saveNow() {
  try {
    const d = {};
    bindings.forEach(([, k]) => d[k] = state[k]);
    d.circle = state.circle; d.qrSize = state.qrSize; d.scale = state.scale;
    localStorage.setItem(KEY, JSON.stringify(d));
  } catch (e) {}
}
function load() {
  let d = {};
  try { d = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) {}
  bindings.forEach(([id, k]) => { if (d[k]) { state[k] = d[k]; $(id).value = d[k]; } });
  if (d.circle) {
    state.circle = Math.max(LAYOUT.photo.minR, d.circle); // 舊資料可能小於白圓
    $('fCircle').value = state.circle;
  }
  if (d.qrSize) { state.qrSize = d.qrSize; $('fQrSize').value = d.qrSize; }
  if (d.scale) { state.scale = d.scale; $('fScale').value = d.scale; }
  $('zoomVal').textContent = state.zoom.toFixed(2) + '×';
  $('circleVal').textContent = state.circle * 2 + 'px';
  $('qrVal').textContent = state.qrSize + 'px';
  syncTitlePreset();
}
load();
render();

if (document.fonts && document.fonts.ready) document.fonts.ready.then(render);
</script>
