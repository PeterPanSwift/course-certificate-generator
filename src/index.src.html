<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>課程獎狀產生器</title>
<style>
  :root{
    --bg:#f4f1ec; --panel:#fff; --line:#e2ddd4; --ink:#3a352f; --muted:#8b8378;
    --gold:#b8974f; --gold-dark:#96772f;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:"Noto Sans TC","PingFang TC","Heiti TC","Microsoft JhengHei",system-ui,sans-serif;
  }
  header{
    padding:18px 24px; background:linear-gradient(100deg,#6d6459,#a1927c 55%,#d9c79a);
    color:#fff; display:flex; align-items:baseline; gap:14px; flex-wrap:wrap;
  }
  header h1{font-size:20px; margin:0; letter-spacing:1px}
  header span{font-size:13px; opacity:.85}
  .wrap{display:flex; gap:20px; padding:20px; align-items:flex-start; flex-wrap:wrap}
  .panel{
    background:var(--panel); border:1px solid var(--line); border-radius:12px;
    box-shadow:0 2px 10px rgba(0,0,0,.05);
  }
  #form{width:340px; flex:0 0 340px; padding:16px}
  #stage{flex:1 1 520px; min-width:360px; padding:16px}
  fieldset{border:none; margin:0 0 4px; padding:0}
  label{display:block; font-size:13px; color:var(--muted); margin:12px 0 5px}
  label:first-child{margin-top:0}
  input[type=text], input[type=url], select{
    width:100%; padding:8px 10px; font-size:14px; font-family:inherit;
    border:1px solid var(--line); border-radius:7px; background:#fcfbf9; color:var(--ink);
  }
  input:focus,select:focus{outline:none; border-color:var(--gold); box-shadow:0 0 0 3px rgba(184,151,79,.15)}
  .row{display:flex; gap:10px}
  .row>div{flex:1}
  .drop{
    margin-top:6px; border:2px dashed var(--line); border-radius:10px; padding:14px;
    text-align:center; font-size:13px; color:var(--muted); cursor:pointer; background:#fcfbf9;
    transition:.15s;
  }
  .drop.over,.drop:hover{border-color:var(--gold); background:#fdf9f0; color:var(--gold-dark)}
  .drop b{display:block; color:var(--ink); font-size:13px; margin-bottom:3px}
  input[type=range]{width:100%; accent-color:var(--gold)}
  .hint{font-size:12px; color:var(--muted); line-height:1.6; margin:8px 0 0}
  details{margin-top:14px; border-top:1px solid var(--line); padding-top:10px}
  summary{font-size:13px; color:var(--muted); cursor:pointer; user-select:none}
  .btns{display:flex; gap:10px; margin-top:18px}
  button{
    font-family:inherit; font-size:14px; padding:10px 14px; border-radius:8px; cursor:pointer;
    border:1px solid var(--line); background:#fff; color:var(--ink); transition:.15s;
  }
  button:hover{border-color:var(--gold); color:var(--gold-dark)}
  button.primary{
    flex:1; border:none; color:#fff; font-weight:700; letter-spacing:1px;
    background:linear-gradient(100deg,var(--gold-dark),var(--gold));
  }
  button.primary:hover{filter:brightness(1.08); color:#fff}
  #canvasBox{position:relative; border-radius:8px; overflow:hidden; background:#eee}
  canvas{display:block; width:100%; height:auto; cursor:grab}
  canvas.dragging{cursor:grabbing}
  .stagehint{font-size:12px; color:var(--muted); margin:10px 2px 0; line-height:1.7}
  .badge{display:inline-block; background:#f0ece3; border-radius:5px; padding:1px 6px; margin-right:4px}
  @media (max-width:820px){ #form{width:100%; flex:1 1 100%} }
</style>
</head>
<body>

<header>
  <h1>課程獎狀產生器</h1>
  <span>填寫資料 → 上傳照片 → 下載 PNG（全離線運作，資料不會上傳）</span>
</header>

<div class="wrap">

  <div class="panel" id="form">
    <fieldset>
      <label for="fTitlePreset">課程名稱</label>
      <select id="fTitlePreset">
        <option value="">— 從清單選擇，或直接在下方輸入 —</option>
        <option>彼得潘的 iOS SwiftUI App 程式設計入門</option>
        <option>文組生的 iOS SwiftUI App 程式設計入門</option>
        <option>彼得潘的 Flutter 跨平台 App 程式設計入門</option>
      </select>
      <input type="text" id="fTitle" placeholder="彼得潘的 iOS SwiftUI App 程式設計入門" style="margin-top:7px">

      <label for="fName">學員姓名</label>
      <input type="text" id="fName" placeholder="許文寧 Becky">

      <div class="row">
        <div>
          <label for="fSession">屆數 (SESSION)</label>
          <input type="text" id="fSession" placeholder="第一屆">
        </div>
        <div>
          <label for="fHours">時數 (LEARNING HOURS)</label>
          <input type="text" id="fHours" placeholder="30">
        </div>
      </div>

      <label for="fDate">日期 (DATE)</label>
      <input type="text" id="fDate" placeholder="2016/7/6 ~ 9/7">

      <label for="fUrl">QR Code 網址</label>
      <input type="url" id="fUrl" placeholder="https://example.com/course">

      <label>學員照片</label>
      <div class="drop" id="drop">
        <b>點此選擇照片，或直接拖曳進來</b>
        JPG / PNG，會自動裁成圓形
      </div>
      <input type="file" id="fPhoto" accept="image/*" hidden>

      <label for="fZoom">照片縮放 <span id="zoomVal" style="float:right"></span></label>
      <input type="range" id="fZoom" min="0.5" max="3" step="0.01" value="1">
    </fieldset>

    <details>
      <summary>進階微調</summary>
      <label for="fCircle">照片圓框大小 <span id="circleVal" style="float:right"></span></label>
      <input type="range" id="fCircle" min="121" max="170" step="1" value="121">

      <label for="fQrSize">QR Code 大小 <span id="qrVal" style="float:right"></span></label>
      <input type="range" id="fQrSize" min="60" max="140" step="1" value="92">

      <label for="fScale">輸出解析度</label>
      <select id="fScale">
        <option value="1">1x（934 × 662）</option>
        <option value="2" selected>2x（1868 × 1324）</option>
        <option value="3">3x（2802 × 1986）</option>
        <option value="4">4x（3736 × 2648）</option>
      </select>
      <p class="hint">照片可直接在右邊預覽圖上拖曳調整位置。</p>
    </details>

    <div class="btns">
      <button class="primary" id="btnDownload">下載獎狀 PNG</button>
      <button id="btnSample" title="填入範例資料">範例</button>
      <button id="btnReset" title="清空所有欄位">清空</button>
    </div>
  </div>

  <div class="panel" id="stage">
    <div id="canvasBox"><canvas id="cv" width="934" height="662"></canvas></div>
    <p class="stagehint">
      <span class="badge">提示</span>在照片上按住滑鼠拖曳可移動位置，滾輪可縮放。
      <br><span class="badge">提示</span>文字太長會自動縮小以符合版面。
    </p>
  </div>

</div>

<script src="__QRCODE_JS__"></script>
<script>
/* ===== 模板與版面座標（以 934 × 662 的原始底圖為基準） ===== */
const TEMPLATE_SRC = "__TEMPLATE_DATA_URI__";
const W = 934, H = 662;

const LAYOUT = {
  title:   { cx: 641, baseline: 204, maxW: 545, size: 34, weight: '700', color: 'rgba(122,114,105,.92)' },
  name:    { cx: 622, baseline: 351, maxW: 515, size: 46, weight: '700', color: '#1e1b18' },
  session: { cx: 789, baseline: 441, maxW: 205, size: 26, weight: '400', color: '#2c2823' },
  hours:   { cx: 789, baseline: 521, maxW: 205, size: 26, weight: '400', color: '#2c2823' },
  date:    { cx: 789, baseline: 601, maxW: 215, size: 26, weight: '400', color: '#2c2823' },
  // 底圖白圓實測：中心 (330, 521)、半徑 120.5，照片至少要蓋滿才不會露白邊
  photo:   { cx: 330, cy: 521, minR: 121 },
  qr:      { cx: 66,  cy: 593 },
};
const FONT = '"Noto Sans TC","PingFang TC","Heiti TC","Microsoft JhengHei",sans-serif';

/* ===== 狀態 ===== */
const state = {
  title: '', name: '', session: '', hours: '', date: '', url: '',
  photo: null, zoom: 1, offX: 0, offY: 0,
  circle: 121, qrSize: 92, scale: 2,
};

const $ = (id) => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');

let template = new Image();
let templateReady = false;
template.onload = () => { templateReady = true; render(); };
template.src = TEMPLATE_SRC;

let qrCache = { text: '', matrix: null };

/* ===== 繪製 ===== */
function fitFont(ctx, text, base, weight, maxW) {
  let size = base;
  ctx.font = `${weight} ${size}px ${FONT}`;
  while (ctx.measureText(text).width > maxW && size > 8) {
    size -= 0.5;
    ctx.font = `${weight} ${size}px ${FONT}`;
  }
  return size;
}

function drawText(ctx, text, cfg) {
  if (!text) return;
  fitFont(ctx, text, cfg.size, cfg.weight, cfg.maxW);
  ctx.fillStyle = cfg.color;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'alphabetic';
  ctx.fillText(text, cfg.cx, cfg.baseline);
}

function drawPhoto(ctx) {
  const { cx, cy } = LAYOUT.photo;
  const r = state.circle;
  if (!state.photo) return;
  ctx.save();
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.closePath();
  ctx.clip();
  const img = state.photo;
  const base = (r * 2) / Math.min(img.width, img.height);
  const s = base * state.zoom;
  const w = img.width * s, h = img.height * s;
  ctx.drawImage(img, cx - w / 2 + state.offX, cy - h / 2 + state.offY, w, h);
  ctx.restore();
}

function drawQR(ctx) {
  const url = state.url.trim();
  if (!url) return;
  if (qrCache.text !== url) {
    try { qrCache = { text: url, matrix: QRCodeGen.encode(url, 'M') }; }
    catch (e) { qrCache = { text: url, matrix: null }; }
  }
  const qr = qrCache.matrix;
  if (!qr) return;

  const box = state.qrSize;
  const x0 = LAYOUT.qr.cx - box / 2, y0 = LAYOUT.qr.cy - box / 2;
  ctx.fillStyle = '#fff';
  ctx.fillRect(x0, y0, box, box);

  // 對齊輸出裝置的實體像素，避免模組邊緣糊掉或互相重疊
  const s = (ctx.getTransform ? ctx.getTransform().a : 1) || 1;
  const snap = (v) => Math.round(v * s) / s;

  const quiet = 2; // 靜區（模組數）
  const n = qr.size + quiet * 2;
  const m = box / n;
  ctx.fillStyle = '#000';
  for (let y = 0; y < qr.size; y++) {
    const y1 = snap(y0 + (y + quiet) * m), y2 = snap(y0 + (y + quiet + 1) * m);
    for (let x = 0; x < qr.size; x++) {
      if (!qr.modules[y][x]) continue;
      const x1 = snap(x0 + (x + quiet) * m), x2 = snap(x0 + (x + quiet + 1) * m);
      ctx.fillRect(x1, y1, x2 - x1, y2 - y1);
    }
  }
}

function paint(ctx) {
  ctx.clearRect(0, 0, W, H);
  if (templateReady) ctx.drawImage(template, 0, 0, W, H);
  drawPhoto(ctx);
  drawQR(ctx);
  drawText(ctx, state.title, LAYOUT.title);
  drawText(ctx, state.name, LAYOUT.name);
  drawText(ctx, state.session, LAYOUT.session);
  drawText(ctx, state.hours, LAYOUT.hours);
  drawText(ctx, state.date, LAYOUT.date);
}

const PREVIEW_SCALE = 2;
cv.width = W * PREVIEW_SCALE;
cv.height = H * PREVIEW_SCALE;

function render() {
  ctx.setTransform(PREVIEW_SCALE, 0, 0, PREVIEW_SCALE, 0, 0);
  paint(ctx);
  save();
}

/* ===== 表單綁定 ===== */
const bindings = [
  ['fTitle', 'title'], ['fName', 'name'], ['fSession', 'session'],
  ['fHours', 'hours'], ['fDate', 'date'], ['fUrl', 'url'],
];
bindings.forEach(([id, key]) => {
  $(id).addEventListener('input', (e) => { state[key] = e.target.value; render(); });
});

// 課程名稱：下拉選單與文字框雙向同步
function syncTitlePreset() {
  const sel = $('fTitlePreset');
  const hit = [...sel.options].some(o => o.value && o.value === state.title);
  sel.value = hit ? state.title : '';
}
$('fTitlePreset').addEventListener('change', (e) => {
  if (!e.target.value) return;
  state.title = e.target.value;
  $('fTitle').value = state.title;
  render();
});
$('fTitle').addEventListener('input', syncTitlePreset);

$('fZoom').addEventListener('input', (e) => {
  state.zoom = parseFloat(e.target.value);
  $('zoomVal').textContent = state.zoom.toFixed(2) + '×';
  render();
});
$('fCircle').addEventListener('input', (e) => {
  state.circle = parseInt(e.target.value, 10);
  $('circleVal').textContent = state.circle * 2 + 'px';
  render();
});
$('fQrSize').addEventListener('input', (e) => {
  state.qrSize = parseInt(e.target.value, 10);
  $('qrVal').textContent = state.qrSize + 'px';
  render();
});
$('fScale').addEventListener('change', (e) => { state.scale = parseInt(e.target.value, 10); save(); });

/* ===== 照片上傳 ===== */
function loadPhotoFile(file) {
  if (!file || !file.type.startsWith('image/')) return;
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      state.photo = img;
      state.zoom = 1; state.offX = 0; state.offY = 0;
      $('fZoom').value = 1; $('zoomVal').textContent = '1.00×';
      $('drop').innerHTML = '<b>已載入照片 ✓</b>點此可更換';
      render();
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}
$('drop').addEventListener('click', () => $('fPhoto').click());
$('fPhoto').addEventListener('change', (e) => loadPhotoFile(e.target.files[0]));
['dragenter', 'dragover'].forEach(t => $('drop').addEventListener(t, e => {
  e.preventDefault(); $('drop').classList.add('over');
}));
['dragleave', 'drop'].forEach(t => $('drop').addEventListener(t, e => {
  e.preventDefault(); $('drop').classList.remove('over');
}));
$('drop').addEventListener('drop', e => loadPhotoFile(e.dataTransfer.files[0]));
document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('drop', e => {
  if (e.target.closest('#drop')) return; // 已由上傳區自行處理
  if (e.dataTransfer.files.length) { e.preventDefault(); loadPhotoFile(e.dataTransfer.files[0]); }
});

/* ===== 在畫布上拖曳 / 滾輪縮放照片 ===== */
let dragging = false, lastX = 0, lastY = 0;
function toTemplateCoords(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) * (W / r.width), y: (e.clientY - r.top) * (H / r.height) };
}
cv.addEventListener('pointerdown', (e) => {
  if (!state.photo) return;
  const p = toTemplateCoords(e);
  if (Math.hypot(p.x - LAYOUT.photo.cx, p.y - LAYOUT.photo.cy) > state.circle) return;
  dragging = true; lastX = p.x; lastY = p.y;
  cv.classList.add('dragging'); cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointermove', (e) => {
  if (!dragging) return;
  const p = toTemplateCoords(e);
  state.offX += p.x - lastX; state.offY += p.y - lastY;
  lastX = p.x; lastY = p.y;
  render();
});
['pointerup', 'pointercancel'].forEach(t => cv.addEventListener(t, () => {
  dragging = false; cv.classList.remove('dragging');
}));
cv.addEventListener('wheel', (e) => {
  if (!state.photo) return;
  const p = toTemplateCoords(e);
  if (Math.hypot(p.x - LAYOUT.photo.cx, p.y - LAYOUT.photo.cy) > state.circle) return;
  e.preventDefault();
  state.zoom = Math.min(3, Math.max(0.5, state.zoom * (e.deltaY < 0 ? 1.06 : 1 / 1.06)));
  $('fZoom').value = state.zoom;
  $('zoomVal').textContent = state.zoom.toFixed(2) + '×';
  render();
}, { passive: false });

/* ===== 下載 ===== */
$('btnDownload').addEventListener('click', () => {
  const s = state.scale;
  const out = document.createElement('canvas');
  out.width = W * s; out.height = H * s;
  const octx = out.getContext('2d');
  octx.imageSmoothingQuality = 'high';
  octx.scale(s, s);
  paint(octx);
  out.toBlob((blob) => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    const who = (state.name || '獎狀').replace(/[\\/:*?"<>|]/g, '_');
    a.download = `獎狀_${who}.png`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  }, 'image/png');
});

/* ===== 範例 / 清空 / 本機記憶 ===== */
const SAMPLE = {
  title: '文組生的 iOS SwiftUI App 程式設計入門',
  name: '許文寧 Becky',
  session: '第一屆',
  hours: '30',
  date: '2016/7/6 ~ 9/7',
  url: 'https://www.apple.com/tw/swift/',
};
function applyValues(v) {
  bindings.forEach(([id, key]) => { state[key] = v[key] || ''; $(id).value = state[key]; });
  syncTitlePreset();
  render();
}
$('btnSample').addEventListener('click', () => applyValues(SAMPLE));
$('btnReset').addEventListener('click', () => {
  applyValues({});
  state.photo = null; state.zoom = 1; state.offX = 0; state.offY = 0;
  $('fZoom').value = 1; $('zoomVal').textContent = '1.00×';
  $('drop').innerHTML = '<b>點此選擇照片，或直接拖曳進來</b>JPG / PNG，會自動裁成圓形';
  render();
});

const KEY = 'certificate-maker-v1';
let saveTimer = 0;
function save() { clearTimeout(saveTimer); saveTimer = setTimeout(saveNow, 250); }
function saveNow() {
  try {
    const d = {};
    bindings.forEach(([, k]) => d[k] = state[k]);
    d.circle = state.circle; d.qrSize = state.qrSize; d.scale = state.scale;
    localStorage.setItem(KEY, JSON.stringify(d));
  } catch (e) {}
}
function load() {
  let d = {};
  try { d = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) {}
  bindings.forEach(([id, k]) => { if (d[k]) { state[k] = d[k]; $(id).value = d[k]; } });
  if (d.circle) {
    state.circle = Math.max(LAYOUT.photo.minR, d.circle); // 舊資料可能小於白圓
    $('fCircle').value = state.circle;
  }
  if (d.qrSize) { state.qrSize = d.qrSize; $('fQrSize').value = d.qrSize; }
  if (d.scale) { state.scale = d.scale; $('fScale').value = d.scale; }
  $('zoomVal').textContent = state.zoom.toFixed(2) + '×';
  $('circleVal').textContent = state.circle * 2 + 'px';
  $('qrVal').textContent = state.qrSize + 'px';
  syncTitlePreset();
}
load();
render();

if (document.fonts && document.fonts.ready) document.fonts.ready.then(render);
</script>
</body>
</html>
